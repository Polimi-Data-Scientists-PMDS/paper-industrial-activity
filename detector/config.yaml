# Default parameters used by the Detector class.
# They can all be overwritten by passing as arguments to Detector.

# The suffix is added to subbucket name (unique identifier for the run).
suffix: ''

collection: COPERNICUS/S1_GRD

# S1A | S1B | S1AB
satellite: S1AB

# A | D | AD
orbit: AD

thresholdx: 0

resolution: 20

window_inner: 200

window_outer: 600

# time interval for composite (date1, date2)
window_date: []

date: null

include_stats: false

use_seive: false

reducer: median

comp_suffix: ''

min_num_images: 5

max_num_images: 100

tile_dx: null

tile_dy: null

dialation_radius: 60

# Google Cloud project used for Earth Engine and Cloud Storage.
# Overridden by the GCP_PROJECT environment variable.

project_id: null

# Cloud Storage bucket where Earth Engine exports the detections.
# Overridden by the GCS_BUCKET environment variable.

bucket: null

# Top-level folder in the bucket for this generation of runs

version: v20260325

# Subbucket: key "directory" under GCS bucket
# if empty, it gets created with above params in the name
subbucket: ''

# Local folder to store parameters and failed task logs

run_dir: runs

# Prefix for parameter and scene log JSON files

param_prefix: PARAMS_

log_prefix: SCENES_

# Ocean polygon to identify SAR scenes that touch the ocean.
# GLOBAL_OCEAN is a world rectangle; the water raster below does the masking.

ocean_vector_uri: GLOBAL_OCEAN

# Public water mask used to remove land, with a shore buffer computed on the fly.
# Also supported: JRC/GSW1_4/GlobalSurfaceWater

ocean_raster_uri: MODIS/006/MOD44W

# Buffer shoreline with 1, 2, 3... (km)

shore_buffer: 1

# Detection footprint (ocean area actually imaged in a scene)

foot_buffer: 500

foot_scale: 500

foot_percentile: 1

foot_usevv: false

# Use single scene for test run
# If both 'date' and 'scene_id' are defined, it gives priority to scene_id

scene_id: null

# Area of interest. Set by the run scripts from the `regions` table below.

region_name: null

region_id: null

region: null

# Named areas of interest.
#   bbox: [lon_min, lat_min, lon_max, lat_max] in degrees (WGS84);
#         width and height in whole degrees (composites are split in 1x1 tiles)
#   srid: metric projection used for distance-based clustering in PostGIS

regions:
  denmark:
    bbox: [7.0, 53.0, 15.0, 57.0]
    srid: 25832  # ETRS89 / UTM zone 32N
  sicily_channel:
    bbox: [9.5, 32.5, 19.5, 39.5]
    srid: 32633  # WGS84 / UTM zone 33N
